<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himalayan Run - Nepal Adventure</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131a;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
  .top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px}
  .panel{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 14px;backdrop-filter:blur(5px)}
  #title{font-size:20px;font-weight:800;letter-spacing:.5px}
  #stats{font-size:15px;line-height:1.6;text-align:right}
  #message{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:25px;font-weight:800;text-align:center;opacity:0;transition:opacity .2s}
  #startScreen,#gameOver{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(4,13,18,.35),rgba(4,13,18,.8));z-index:5}
  .card{max-width:560px;margin:20px;padding:30px;border-radius:24px;text-align:center;color:#fff;background:rgba(8,24,31,.88);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px #0008}
  h1{font-size:42px;margin:0 0 8px}
  h2{font-size:30px;margin:0 0 10px}
  p{line-height:1.6;color:#dce8eb}
  button{border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:800;background:#f4b942;color:#1b1608;cursor:pointer;box-shadow:0 5px 0 #9d7020}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #9d7020}
  #gameOver{display:none}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px auto;max-width:300px}
  .key{padding:9px;border-radius:9px;background:#ffffff18;border:1px solid #ffffff22;font-size:13px}
  #mobile{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:4}
  #mobile button{width:58px;height:52px;padding:0;border-radius:14px;font-size:20px;background:#ffffff22;color:#fff;box-shadow:none;border:1px solid #ffffff33;backdrop-filter:blur(5px)}
  @media(min-width:800px){#mobile{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="panel"><div id="title">🇳🇵 HIMALAYAN RUN</div><div id="status">Kathmandu → Himalayas</div></div>
    <div id="stats" class="panel">Score: <b id="score">0</b><br>Coins: <b id="coins">0</b><br>Speed: <b id="speed">1.0x</b></div>
  </div>
  <div id="message"></div>
</div>

<div id="startScreen">
  <div class="card">
    <h1>Himalayan Run</h1>
    <p>Run through Nepal's mountain trails, collect coins and dodge ancient ruins, prayer flags and fallen logs while a dinosaur hunter chases you.</p>
    <div class="keys">
      <div></div><div class="key">↑ / W<br>Jump</div><div></div>
      <div class="key">← / A<br>Left</div><div class="key">↓ / S<br>Slide</div><div class="key">→ / D<br>Right</div>
    </div>
    <button id="startBtn">START ADVENTURE</button>
  </div>
</div>

<div id="gameOver">
  <div class="card">
    <h2>Run Over!</h2>
    <p id="overText"></p>
    <button id="restartBtn">RUN AGAIN</button>
  </div>
</div>

<div id="mobile">
  <button data-action="left">←</button>
  <button data-action="jump">↑</button>
  <button data-action="slide">↓</button>
  <button data-action="right">→</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize); resize();

const lanes=[-1,0,1];
let running=false, gameOver=false, last=0, distance=0, score=0, coinCount=0, speed=0.48;
let lane=1,targetLane=1,y=0,vy=0,slide=0;
let obstacles=[], coins=[], scenery=[];
let spawnTimer=0, coinTimer=0, hunterPulse=0;

function reset(){
  running=true;gameOver=false;distance=0;score=0;coinCount=0;speed=.48;
  lane=1;targetLane=1;y=0;vy=0;slide=0;spawnTimer=0;coinTimer=.4;hunterPulse=0;
  obstacles=[];coins=[];scenery=[];
  for(let i=0;i<18;i++) scenery.push({z:i/18*1.25+.05,side:i%2?1:-1,type:i%3});
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOver').style.display='none';
  last=performance.now();requestAnimationFrame(loop);
}
function endGame(reason){
  running=false;gameOver=true;
  document.getElementById('overText').innerHTML=`You scored <b>${Math.floor(score)}</b> points and collected <b>${coinCount}</b> coins.<br>${reason}`;
  document.getElementById('gameOver').style.display='flex';
}
function move(dir){if(!running)return;targetLane=Math.max(0,Math.min(2,targetLane+dir))}
function jump(){if(running && y===0){vy=.92;}}
function doSlide(){if(running){slide=.55}}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','a'].includes(k))move(-1);
  if(['arrowright','d'].includes(k))move(1);
  if(['arrowup','w',' '].includes(k)){e.preventDefault();jump()}
  if(['arrowdown','s'].includes(k)){e.preventDefault();doSlide()}
  if(k==='r' && gameOver)reset();
});
document.querySelectorAll('#mobile button').forEach(b=>b.addEventListener('pointerdown',()=>{
  const a=b.dataset.action;if(a==='left')move(-1);if(a==='right')move(1);if(a==='jump')jump();if(a==='slide')doSlide();
}));
document.getElementById('startBtn').onclick=reset;
document.getElementById('restartBtn').onclick=reset;

function roadPoint(l,z){
  // z: 0 near player, 1 far away
  const horizon=H*.31;
  const p=Math.pow(1-z,1.65);
  const roadW=W*(.16+.72*p);
  const cx=W/2 + Math.sin(distance*.0007+z*7)*W*.035*(1-p);
  return {x:cx + (l-1)*roadW/3, y:horizon+(H-horizon)*p, w:roadW/3};
}
function scaleZ(z){return .25+1.75*Math.pow(1-z,1.5)}
function spawnObstacle(){
  const types=['rock','log','gate'];
  obstacles.push({lane:Math.floor(Math.random()*3),z:1.05,type:types[Math.floor(Math.random()*types.length)],hit:false});
}
function spawnCoin(){
  coins.push({lane:Math.floor(Math.random()*3),z:1.08,spin:Math.random()*6});
}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6db6d8');g.addColorStop(.48,'#d9eef0');g.addColorStop(1,'#b8d18e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // distant Himalayan peaks
  ctx.fillStyle='#718d98';
  ctx.beginPath();ctx.moveTo(0,H*.42);
  for(let x=0;x<=W;x+=70){let ph=(x*17)%130;ctx.lineTo(x,H*.39-ph*.0015);ctx.lineTo(x+35,H*.27-(ph%60)*.001);ctx.lineTo(x+70,H*.4)}
  ctx.lineTo(W,H*.52);ctx.lineTo(0,H*.52);ctx.fill();
  ctx.fillStyle='#edf4f1';
  ctx.beginPath();ctx.moveTo(W*.35,H*.35);ctx.lineTo(W*.5,H*.18);ctx.lineTo(W*.65,H*.35);ctx.lineTo(W*.56,H*.29);ctx.lineTo(W*.5,H*.23);ctx.lineTo(W*.44,H*.3);ctx.closePath();ctx.fill();
}
function drawRoad(){
  const horizon=H*.31;
  ctx.fillStyle='#71994f';ctx.fillRect(0,horizon,W,H-horizon);
  const near=roadPoint(1,0), far=roadPoint(1,1);
  ctx.fillStyle='#7c6548';
  ctx.beginPath();ctx.moveTo(far.x-far.w*1.5,horizon);ctx.lineTo(far.x+far.w*1.5,horizon);ctx.lineTo(near.x+near.w*1.5,H);ctx.lineTo(near.x-near.w*1.5,H);ctx.closePath();ctx.fill();
  // center trail stones
  for(let i=0;i<14;i++){
    const z=(i/14+(distance*.0015))%1;
    const p=roadPoint(1,z), s=scaleZ(z)*4;
    ctx.fillStyle='#b39b78';ctx.fillRect(p.x-s/2,p.y-s/5,s,s/2);
  }
}
function drawTree(x,y,s){
  ctx.fillStyle='#503d2c';ctx.fillRect(x-s*.08,y-s*.65,s*.16,s*.65);
  ctx.fillStyle='#275a38';ctx.beginPath();ctx.arc(x,y-s*.78,s*.38,0,Math.PI*2);ctx.arc(x-s*.25,y-s*.62,s*.3,0,Math.PI*2);ctx.arc(x+s*.25,y-s*.62,s*.3,0,Math.PI*2);ctx.fill();
}
function drawScenery(){
  scenery.forEach(o=>{
    o.z-=speed*.0007;
    if(o.z<-.05)o.z=1.08+Math.random()*.2;
    const p=roadPoint(o.side===-1?0:2,o.z), s=scaleZ(o.z);
    if(o.type===0)drawTree(p.x+(o.side?-1:1)*18*s,p.y,36*s);
    else if(o.type===1){
      ctx.strokeStyle='#7c4d35';ctx.lineWidth=Math.max(1,3*s);
      ctx.beginPath();ctx.moveTo(p.x-12*s,p.y);ctx.lineTo(p.x+12*s,p.y-35*s);ctx.stroke();
      ctx.fillStyle='#d84f43';ctx.fillRect(p.x-12*s,p.y-36*s,24*s,7*s);
    }else{
      ctx.fillStyle='#6c5540';ctx.fillRect(p.x-16*s,p.y-18*s,32*s,18*s);
      ctx.fillStyle='#d7c08b';ctx.fillRect(p.x-11*s,p.y-13*s,7*s,6*s);ctx.fillRect(p.x+4*s,p.y-13*s,7*s,6*s);
    }
  });
}
function drawObject(o){
  const p=roadPoint(o.lane,o.z),s=scaleZ(o.z);
  if(o.type==='rock'){
    ctx.fillStyle='#51483f';ctx.beginPath();ctx.moveTo(p.x-22*s,p.y);ctx.lineTo(p.x-14*s,p.y-25*s);ctx.lineTo(p.x+8*s,p.y-31*s);ctx.lineTo(p.x+25*s,p.y-7*s);ctx.lineTo(p.x+18*s,p.y);ctx.closePath();ctx.fill();
  } else if(o.type==='log'){
    ctx.save();ctx.translate(p.x,p.y-12*s);ctx.rotate(-.08);
    ctx.fillStyle='#633f2c';ctx.fillRect(-30*s,-9*s,60*s,18*s);
    ctx.fillStyle='#a77850';ctx.beginPath();ctx.arc(30*s,0,9*s,0,Math.PI*2);ctx.fill();ctx.restore();
  } else {
    ctx.strokeStyle='#5a3d2b';ctx.lineWidth=8*s;
    ctx.beginPath();ctx.moveTo(p.x-30*s,p.y);ctx.lineTo(p.x-30*s,p.y-55*s);ctx.moveTo(p.x+30*s,p.y);ctx.lineTo(p.x+30*s,p.y-55*s);ctx.stroke();
    ctx.fillStyle='#b23b36';ctx.fillRect(p.x-34*s,p.y-52*s,68*s,12*s);
  }
}
function drawCoin(c){
  const p=roadPoint(c.lane,c.z),s=scaleZ(c.z)*10;
  ctx.save();ctx.translate(p.x,p.y-28*s);ctx.rotate(c.spin);
  ctx.fillStyle='#f4c542';ctx.beginPath();ctx.ellipse(0,0,s*.62,s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff0a0';ctx.font=`bold ${Math.max(8,s)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('रु',0,1);
  ctx.restore();
}
function drawPlayer(){
  const p=roadPoint(lane,0),s=Math.min(W,H)/700;
  const bob=Math.sin(distance*.025)*3;
  const jumpY=y*H*.19;
  ctx.save();ctx.translate(p.x,p.y-jumpY+bob);
  if(slide>0){ctx.scale(1,.58);ctx.translate(0,30)}
  // backpack
  ctx.fillStyle='#b77b3b';ctx.fillRect(-25*s,-95*s,18*s,55*s);
  // legs
  ctx.strokeStyle='#27313a';ctx.lineWidth=10*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-7*s,-25*s);ctx.lineTo(-17*s,10*s);ctx.moveTo(7*s,-25*s);ctx.lineTo(18*s,10*s);ctx.stroke();
  // body
  ctx.fillStyle='#172b35';ctx.fillRect(-19*s,-78*s,38*s,52*s);
  // scarf
  ctx.fillStyle='#d84538';ctx.fillRect(-21*s,-70*s,42*s,9*s);
  // head
  ctx.fillStyle='#b8784d';ctx.beginPath();ctx.arc(0,-94*s,16*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#171513';ctx.beginPath();ctx.arc(0,-102*s,17*s,Math.PI,Math.PI*2);ctx.fill();
  // arms
  ctx.strokeStyle='#b8784d';ctx.lineWidth=8*s;ctx.beginPath();ctx.moveTo(-18*s,-68*s);ctx.lineTo(-35*s,-42*s);ctx.moveTo(18*s,-68*s);ctx.lineTo(35*s,-42*s);ctx.stroke();
  ctx.restore();
}
function drawHunter(){
  // Dinosaur hunter appears behind the runner; its size increases as the chase gets dangerous.
  const danger=Math.min(1,Math.max(0,(speed-.48)/.7));
  const x=W/2+Math.sin(distance*.012)*W*.03;
  const base=H*.82, s=(.65+danger*.45)*Math.min(W,H)/700;
  ctx.save();ctx.translate(x,base);
  // shadow
  ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,10,75*s,16*s,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle='#3b3029';ctx.lineWidth=12*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-28*s,-8*s);ctx.lineTo(-38*s,35*s);ctx.moveTo(28*s,-8*s);ctx.lineTo(38*s,35*s);ctx.stroke();
  // body
  ctx.fillStyle='#5b483d';ctx.beginPath();ctx.ellipse(0,-65*s,62*s,72*s,0,0,Math.PI*2);ctx.fill();
  // neck
  ctx.fillStyle='#624d40';ctx.beginPath();ctx.moveTo(-25*s,-110*s);ctx.lineTo(15*s,-185*s);ctx.lineTo(45*s,-178*s);ctx.lineTo(30*s,-90*s);ctx.closePath();ctx.fill();
  // dinosaur head
  ctx.fillStyle='#735648';ctx.beginPath();ctx.ellipse(20*s,-195*s,52*s,32*s,-.05,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#15120f';ctx.beginPath();ctx.arc(43*s,-202*s,5*s,0,Math.PI*2);ctx.fill();
  // hunter hat
  ctx.fillStyle='#2d332e';ctx.beginPath();ctx.ellipse(8*s,-224*s,45*s,9*s,0,0,Math.PI*2);ctx.fill();ctx.fillRect(-17*s,-238*s,45*s,16*s);
  // binoculars
  ctx.strokeStyle='#b9a36b';ctx.lineWidth=4*s;ctx.beginPath();ctx.arc(-2*s,-195*s,8*s,0,Math.PI*2);ctx.arc(17*s,-195*s,8*s,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function update(dt){
  distance+=speed*dt*60;
  speed=Math.min(1.25,.48+distance*.000012);
  score+=speed*dt*55;
  hunterPulse+=dt;
  lane+=(targetLane-lane)*Math.min(1,dt*12);
  if(y>0||vy>0){y+=vy*dt*60;vy-=.07*dt*60;if(y<=0){y=0;vy=0}}
  slide=Math.max(0,slide-dt);
  spawnTimer-=dt;coinTimer-=dt;
  if(spawnTimer<=0){spawnObstacle();spawnTimer=Math.max(.55,1.2-speed*.5)*(0.75+Math.random()*.7)}
  if(coinTimer<=0){spawnCoin();coinTimer=.38+Math.random()*.45}
  obstacles.forEach(o=>o.z-=speed*dt);
  coins.forEach(c=>{c.z-=speed*dt;c.spin+=dt*7});
  // collision detection near the player
  for(const o of obstacles){
    if(o.z<.12 && o.z>-.03 && Math.abs(o.lane-lane)<.38){
      if(y<.22 && !(o.type==='gate'&&slide>0)){
        endGame('The dinosaur hunter caught up with you!');
        return;
      }
    }
  }
  for(const c of coins){
    if(c.z<.13&&c.z>-.02&&Math.abs(c.lane-lane)<.38){
      c.z=-1;coinCount++;score+=100;
      showMessage('+100 COIN');
    }
  }
  obstacles=obstacles.filter(o=>o.z>-.1);
  coins=coins.filter(c=>c.z>-.1);
  document.getElementById('score').textContent=Math.floor(score);
  document.getElementById('coins').textContent=coinCount;
  document.getElementById('speed').textContent=(speed/.48).toFixed(1)+'x';
}
let msgTimer=0;
function showMessage(t){const m=document.getElementById('message');m.textContent=t;m.style.opacity=1;msgTimer=.55}
function render(){
  drawSky();drawRoad();drawScenery();
  [...obstacles].sort((a,b)=>b.z-a.z).forEach(drawObject);
  [...coins].sort((a,b)=>b.z-a.z).forEach(drawCoin);
  drawHunter();drawPlayer();
  if(msgTimer>0){msgTimer-=1/60;if(msgTimer<=0)document.getElementById('message').style.opacity=0}
}
function loop(t){
  if(!running)return;
  const dt=Math.min(.035,(t-last)/1000);last=t;
  update(dt);render();
  if(running)requestAnimationFrame(loop);
}
render();
</script>
</body>
</html>
